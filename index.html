<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出発時刻計算</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 12px 0 6px; }
    input { font-size: 16px; padding: 8px; width: 220px; }
    button { margin-top: 16px; padding: 10px 14px; font-size: 16px; }
    .result { margin-top: 18px; font-size: 18px; font-weight: 600; }
    .note { color: #555; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>出発時刻計算</h1>
<div style="margin: 10px 0 18px; font-size: 28px; font-weight: 700;">
  現在時刻：<span id="clock">--:--:--</span>
</div>
  <label>着弾予定時刻（hh:mm:ss）</label>
  <input id="arrival" placeholder="例: 21:05:10" />

  <label>行軍時間（mm:ss）</label>
  <input id="march" placeholder="例: 0105 / 105（=01:05)/ " />

  <button id="calc">計算</button>

  <div class="result" id="out"></div>
  <div class="note">※日付をまたぐ場合は前日の時刻になります。</div>

  <script>
function formatClock(d){
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const ss = String(d.getSeconds()).padStart(2, "0");
  return `${hh}:${mm}:${ss}`;
}

function startClock(){
  const el = document.getElementById("clock");
  const tick = () => { el.textContent = formatClock(new Date()); };
  tick();                 // 初回即表示
  setInterval(tick, 250); // 0.25秒ごと更新（秒の変わり目が見やすい）
}

startClock();

    function pad2(n){ return String(n).padStart(2, "0"); }

    function parseArrival(input){
  const s = input.trim();

  // 13:45:30 形式
  let m = /^(\d{1,2}):(\d{2}):(\d{2})$/.exec(s);
  if (m) {
    const hh = Number(m[1]), mm = Number(m[2]), ss = Number(m[3]);
    if (mm <= 59 && ss <= 59) return { hh, mm, ss };
    return null;
  }

  // 134530 形式（6桁）
  m = /^(\d{2})(\d{2})(\d{2})$/.exec(s);
  if (m) {
    const hh = Number(m[1]), mm = Number(m[2]), ss = Number(m[3]);
    if (hh <= 23 && mm <= 59 && ss <= 59) return { hh, mm, ss };
    return null;
  }

  return null;
}

function parseMarch(input){
  const s = input.trim();

  // 25:00 形式
  let m = /^(\d{1,3}):(\d{2})$/.exec(s);
  if (m) {
    const mm = Number(m[1]), ss = Number(m[2]);
    if (ss <= 59) return { mm, ss };
    return null;
  }

  // 2500 形式（4桁 → mm:ss）
  m = /^(\d{2})(\d{2})$/.exec(s);
  if (m) {
    const mm = Number(m[1]), ss = Number(m[2]);
    if (ss <= 59) return { mm, ss };
    return null;
  }

  // 905 形式（3桁 → m:ss ＝ 09:05）
  m = /^(\d)(\d{2})$/.exec(s);
  if (m) {
    const mm = Number(m[1]), ss = Number(m[2]);
    if (ss <= 59) return { mm, ss };
    return null;
  }

  return null;
}
    document.getElementById("calc").addEventListener("click", () => {
      const arrival = parseArrival(document.getElementById("arrival").value);
const march = parseMarch(document.getElementById("march").value);
      const out = document.getElementById("out");

      if(!arrival || !march){
        out.textContent = "入力形式を確認してください。";
        return;
      }

      const arrivalSec = arrival.hh*3600 + arrival.mm*60 + arrival.ss;
      const marchSec = march.mm*60 + march.ss;

      let departSec = arrivalSec - marchSec;
      // 0未満なら前日に繰り下げ（24h加算）
      if(departSec < 0) departSec += 24*3600;

      const dh = Math.floor(departSec / 3600);
      const dm = Math.floor((departSec % 3600) / 60);
      const ds = departSec % 60;

      out.textContent = `出発時刻：${pad2(dh)}:${pad2(dm)}:${pad2(ds)}`;
    });
  </script>
</body>
</html>
